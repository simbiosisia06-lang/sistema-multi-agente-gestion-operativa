services:
  # ==========================================
  # Motor de Orquestación e Integración (n8n)
  # ==========================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-replace_this_with_a_secure_encryption_key_32_chars}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - backend-network
    depends_on:
      - nocodb

  # ==========================================
  # Base de Datos Relacional No-Code (NocoDB)
  # ==========================================
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    ports:
      - "${NOCODB_PORT:-8080}:8080"
    environment:
      - NC_DB=${NC_DB:-sqlite3:/usr/app/data/noco.db}
      - NC_AUTH_JWT_SECRET=${NC_AUTH_JWT_SECRET:-replace_this_with_a_secure_jwt_secret_key_32_chars}
      - NC_PUBLIC_URL=${NC_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - nocodb_data:/usr/app/data
    networks:
      - backend-network

  # ==========================================
  # Motor de Inferencia Local (Ollama)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend-network

networks:
  backend-network:
    name: backend-network
    driver: bridge

volumes:
  n8n_data:
    name: n8n_data
  nocodb_data:
    name: nocodb_data
  ollama_data:
    name: ollama_data
